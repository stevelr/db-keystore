[package]
name = "db-keystore"
version = "0.6.0-pre.2"
authors = ["Steve Schoettler <stevelr-git@pm.me>"]
categories = ["database", "api-bindings"]
edition = "2024"
homepage = "https://github.com/stevelr/db-keystore"
keywords = ["keyring", "credential", "sqlite", "turso", "secrets-manager"]
license = "MIT or Apache-2.0"
readme = "README.md"
repository = "https://github.com/stevelr/db-keystore"
rust-version = "1.88"
description = "Encrypted SQLite credential store for the `keyring-core` API, backed by turso"

[lib]

[[bin]]
name = "db-keystore"
path = "bin/db-keystore.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:anyhow", "dep:clap", "dep:serde", "dep:serde_json"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
futures = "0.3.34"
keyring-core = "1.0.0"
log = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
turso = { version = "=0.8.0-pre.10", default-features = false }
uuid = { version = "1.26.1", features = ["v7"] }
zeroize = "1.9.0"

# pinned versions of all turso
turso_core = "=0.8.0-pre.10"
turso_sdk_kit = "=0.8.0-pre.10"
turso_sync_sdk_kit = "=0.8.0-pre.10"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
